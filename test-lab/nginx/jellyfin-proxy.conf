# A deliberately "nasty" reverse proxy in front of Jellyfin, to reproduce the
# class of bugs reported behind real proxies (#95, and the proxy side of #102).
#
# It does two hostile things on purpose:
#   1. sub_filter on </head>  — the exact pattern that broke setup.html in #95
#      (a tab/branding rewrite that matched a </head> inside inline JS).
#   2. a strict Content-Security-Policy — surfaces inline-script/style CSP issues.
#
# Reach Jellyfin through this proxy at http://localhost:8097.
# To test the "clean proxy" baseline, comment out the sub_filter + CSP lines.

server {
    listen 80;
    server_name _;

    # Large bodies (avatar/library uploads) + websockets for live updates.
    client_max_body_size 0;

    location / {
        proxy_pass http://jellyfin:8096;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websockets (Jellyfin uses them for the dashboard + sync play).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- HOSTILE #1: rewrite the browser tab title via sub_filter. -------
        # This is the chrisbehectik #95 setup. Because the match string is a bare
        # </head>, nginx historically also rewrote a </head> that appeared inside
        # one of the plugin's own inline-JS strings. v2.5.15 split those tags so
        # this can no longer corrupt the page — keep this enabled to PROVE it.
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script>document.title="MyMedia";</script></head>';

        # --- HOSTILE #2: a strict CSP. ---------------------------------------
        # Comment this out to compare behaviour without CSP. Note Jellyfin Web +
        # the injected plugin UI rely on inline scripts/styles, so an overly
        # strict policy here is itself a good way to catch CSP regressions.
# (CSP disabled for the #95 sub_filter isolation test — re-enable to test CSP strictness separately)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;
    }
}
